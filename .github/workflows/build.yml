name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ClipZero.slnx
      - name: Build
        run: dotnet build ClipZero.slnx -c Release --no-restore
      - name: Run clipboard logic tests
        run: dotnet run --project tests/ClipZero.Tests/ClipZero.Tests.csproj -c Release --no-build
      - name: Run Explorer helper tests without registry changes
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/ExplorerUndo.Tests.ps1

  package:
    name: Package ${{ matrix.runtime }} (${{ matrix.mode }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
        mode: [framework-dependent, self-contained]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish, package and checksum
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime '${{ matrix.runtime }}' -Mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ClipZero-${{ matrix.runtime }}-${{ matrix.mode }}
          path: artifacts/packages/*
          if-no-files-found: error
